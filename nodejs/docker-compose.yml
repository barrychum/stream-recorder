services:
  stream-recorder:
    # build: .
    image: stellarhub/stream-recorder:nodejs.1.0
    container_name: stream-recorder
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent schedule data
      - ./data:/data
      # Recordings output — change host path as needed
      - ./recordings:/recordings
    environment:
      # - TZ=Europe/London
      - TZ=Hongkong
      - PORT=3000
    # Allow access to local network streams (self-signed certs, LAN IPs)
    extra_hosts:
      - "host.docker.internal:host-gateway"
